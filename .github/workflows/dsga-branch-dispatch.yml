name: Dispatch maintained Neon DSGA candidate release

# This bootstrap workflow lives on main so GitHub can register push events for the
# maintained feature branch. The actual release implementation remains on the
# immutable, reviewed branch commit below; product source is checked out from the
# triggering branch SHA and validated by the reusable release workflow.
on:
  push:
    branches: ['codex/dsga-neon-v3-20261019']

permissions:
  contents: read

jobs:
  unified-dsga-release:
    name: Run the pinned DSGA release pipeline
    permissions:
      contents: write
      actions: read
      packages: write
    uses: william-lbn/neon/.github/workflows/dsga-release.yml@a5d543092110c27c16192b23b96edd0aa7b5392d
    with:
      arch: amd64
      normal_guest: false
    secrets: inherit
