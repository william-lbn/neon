name: Distribution checks and DSGA release dispatcher
on:
  pull_request:
  push:
    branches: ['codex/dsga-neon-v3-20261019']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    # The complete source contract suite must pass before a candidate release can publish.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 ci/compute.py validate
      - name: Run the complete Neon source and release contract suite
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v

  dsga-unified-release:
    needs: contracts
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/codex/dsga-neon-v3-20261019'
    name: Unified DSGA candidate release
    permissions:
      contents: write
      actions: read
      packages: write
    uses: william-lbn/neon/.github/workflows/dsga-release.yml@08eff7a8fff7c4ad8808c3d0015b4dcabce5afc6
    with:
      arch: amd64
      normal_guest: false
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
