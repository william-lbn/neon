name: Distribution pull request checks
# 质量门禁同时覆盖 PR 和 DSGA 研发分支直接 Push；完整发行仍由 dsga-release.yml 显式触发。
on:
  push:
    branches: ['codex/dsga-neon-*']
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 ci/compute.py validate
      - run: python3 ci/run-release-contracts.py
  dsga-pg17:
    # 专项门禁必须真实运行，不能以contracts中的环境skip代替。只编译宿主PG，
    # 不打包镜像，不部署K8s；真实VM/Provider能力按V3另行验收。
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout exact PG17 dependency
        run: git submodule update --init --depth 1 vendor/postgres-v17
      - run: python3 ci/compute.py validate --source-ref HEAD --require-pg-checkout v17
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex pkg-config libcurl4-openssl-dev libssl-dev openssl clang libipc-run-perl libio-pty-perl
      - name: Build asserted PG17 with deterministic injection points
        run: |
          make -j4 postgres-v17 POSTGRES_VERSIONS=v17 \
            BUILD_DIR="$GITHUB_WORKSPACE/build/dsga-pg" \
            POSTGRES_INSTALL_DIR="$GITHUB_WORKSPACE/build/dsga-install" \
            PG_CONFIGURE_OPTS='--without-icu --without-readline --without-zlib --enable-debug --enable-cassert --enable-depend --enable-injection-points'
      - name: Run every real DSGA lifecycle test
        run: bash ci/test-dsg-postgres.sh "$GITHUB_WORKSPACE/build/dsga-pg/v17" "$GITHUB_WORKSPACE/build/dsga-install/v17"
      - name: Build and load the full Neon extension with real storage compatibility tests
        env:
          CARGO_BUILD_JOBS: "4"
        run: bash ci/test-dsg-neon-extension.sh "$GITHUB_WORKSPACE/build/dsga-pg/v17" "$GITHUB_WORKSPACE/build/dsga-install/v17"
      - name: Run native regression and TAP with dynamic mode off and on
        run: bash ci/test-dsg-postgres-world.sh "$GITHUB_WORKSPACE/build/dsga-pg/v17" "$GITHUB_WORKSPACE/build/dsga-install/v17"
      - name: Exercise real DSGA Rust sessions and Compute HTTP control
        env:
          CARGO_BUILD_JOBS: "4"
        run: bash ci/test-dsg-rust-client.sh "$GITHUB_WORKSPACE/build/dsga-install/v17"
      - name: Validate DSGA shared control request contracts
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo test --locked -p compute_api

  # PG18 使用与发行锁相同的不可变源码提交，执行真实内核回归与 DSGA 原生门禁。
  dsga-pg18:
    name: PostgreSQL 18 DSGA native kernel gate
    uses: william-lbn/postgres/.github/workflows/build.yml@47f4ff0d390996bffeaa6a14aa58ea6c29637855
    with:
      source_sha: 47f4ff0d390996bffeaa6a14aa58ea6c29637855
