name: Distribution pull request checks
on:
  pull_request:
  push:
    branches: ['codex/dsga-neon-v3-20261019']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 ci/compute.py validate
      - run: python3 -m unittest discover -s ci -p 'test_*.py' -v

  dsga-unified-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/dsga-neon-v3-20261019'
    name: Unified DSGA candidate release
    permissions:
      contents: write
      actions: read
      packages: write
    uses: william-lbn/neon/.github/workflows/dsga-release.yml@a5d543092110c27c16192b23b96edd0aa7b5392d
    with:
      arch: amd64
      normal_guest: false
    secrets: inherit
