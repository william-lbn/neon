name: Distribution checks and DSGA release dispatcher
on:
  pull_request:
  push:
    branches: ['codex/dsga-neon-v3-20261019']
  workflow_dispatch:
permissions:
  contents: read
# 同一 PR 的新提交取消旧 PR 检查；发行 Push 不取消正在运行的候选发行。
# GitHub 保留一个运行中的任务和一个最新 pending 任务，避免长时间原生构建互相抢占。
concurrency:
  group: neon-dsga-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    # Every PR and every candidate-release trigger must pass the complete source-level
    # contract suite before any cross-repository build or registry write can begin.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate compute source and pinned PostgreSQL gitlinks
        run: python3 ci/compute.py validate
      - name: Run the complete Neon source and release contract suite
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v

  dsga-pg17:
    if: github.event_name == 'pull_request'
    # 专项门禁必须真实运行，不能以contracts中的环境skip代替。只编译宿主PG，
    # 不打包镜像，不部署K8s；真实VM/Provider能力按V3另行验收。
    # 本Job还包含Neon扩展、Rust客户端及双模式原生回归，预留足够编译/测试时间。
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout exact PG17 dependency
        run: git submodule update --init --depth 1 vendor/postgres-v17
      - run: python3 ci/compute.py validate --source-ref HEAD --require-pg-checkout v17
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex pkg-config libcurl4-openssl-dev libssl-dev openssl clang libipc-run-perl libio-pty-perl
      - name: Build asserted PG17 with deterministic injection points
        run: |
          make -j4 postgres-v17 POSTGRES_VERSIONS=v17 \
            BUILD_DIR="$GITHUB_WORKSPACE/build/dsga-pg" \
            POSTGRES_INSTALL_DIR="$GITHUB_WORKSPACE/build/dsga-install" \
            PG_CONFIGURE_OPTS='--without-icu --without-readline --without-zlib --enable-debug --enable-cassert --enable-depend --enable-injection-points'
      - name: Run every real DSGA lifecycle test
        run: bash ci/test-dsg-postgres.sh "$GITHUB_WORKSPACE/build/dsga-pg/v17" "$GITHUB_WORKSPACE/build/dsga-install/v17"
      - name: Build and load the full Neon extension with real storage compatibility tests
        env:
          CARGO_BUILD_JOBS: "4"
        run: bash ci/test-dsg-neon-extension.sh "$GITHUB_WORKSPACE/build/dsga-pg/v17" "$GITHUB_WORKSPACE/build/dsga-install/v17"
      - name: Run native regression and TAP with dynamic mode off and on
        run: bash ci/test-dsg-postgres-world.sh "$GITHUB_WORKSPACE/build/dsga-pg/v17" "$GITHUB_WORKSPACE/build/dsga-install/v17"
      - name: Exercise real DSGA Rust sessions and Compute HTTP control
        env:
          CARGO_BUILD_JOBS: "4"
        run: bash ci/test-dsg-rust-client.sh "$GITHUB_WORKSPACE/build/dsga-install/v17"
      - name: Validate DSGA shared control request contracts
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo test --locked -p compute_api

  # PG18 的 workflow ref、source_sha、distribution.json 与 vendor gitlink 必须保持同一完整 SHA。
  # 不得改用浮动分支或跳过该门禁，否则 Compute 与发行镜像可能来自不同内核源码。
  dsga-pg18:
    if: github.event_name == 'pull_request'
    name: PostgreSQL 18 DSGA native kernel gate
    uses: william-lbn/postgres/.github/workflows/build.yml@47f4ff0d390996bffeaa6a14aa58ea6c29637855
    with:
      source_sha: 47f4ff0d390996bffeaa6a14aa58ea6c29637855

  dsga-unified-release:
    needs: contracts
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/codex/dsga-neon-v3-20261019'
    name: Unified DSGA candidate release
    permissions:
      contents: write
      actions: read
      packages: write
    uses: william-lbn/neon/.github/workflows/dsga-release.yml@68b602c1649d6d2c1259c59360a957f06dee7655
    with:
      arch: amd64
      normal_guest: false
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
