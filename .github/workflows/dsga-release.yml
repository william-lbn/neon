name: DSGA unified candidate distribution
on:
  workflow_call:
    inputs:
      arch:
        description: Candidate platform (Helm currently supports amd64 only)
        type: string
        required: false
        default: amd64
      normal_guest:
        description: Build both PostgreSQL 17 and 18 normal-split-v3 Guests
        type: boolean
        required: false
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      arch:
        description: Candidate platform (Helm currently supports amd64 only)
        type: choice
        options: [amd64]
        default: amd64
      normal_guest:
        description: Build both PostgreSQL 17 and 18 normal-split-v3 Guests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dsga-distribution-${{ github.ref }}-${{ inputs.arch || 'amd64' }}
  # New feature-branch commits supersede unfinished candidates; published versions stay immutable.
  cancel-in-progress: ${{ github.event_name == 'push' }}
env:
  REGISTRY: docker.io/williamluckyli
  ARCH: ${{ inputs.arch || 'amd64' }}
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      autoscaling: ${{ steps.meta.outputs.autoscaling }}
      control_plane: ${{ steps.meta.outputs.control_plane }}
      binaries: ${{ steps.meta.outputs.binaries }}
      compute_components: ${{ steps.meta.outputs.compute_components }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
      helm: ${{ steps.meta.outputs.helm }}
      pg17: ${{ steps.meta.outputs.pg17 }}
      pg18: ${{ steps.meta.outputs.pg18 }}
      postgres_matrix: ${{ steps.meta.outputs.postgres_matrix }}
      distribution_artifact: ${{ steps.meta.outputs.distribution_artifact }}
      normal_carrier_pg17: ${{ steps.normal-inputs.outputs.carrier_pg17 }}
      normal_carrier_pg18: ${{ steps.normal-inputs.outputs.carrier_pg18 }}
      normal_ordinary: ${{ steps.normal-inputs.outputs.ordinary }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 ci/compute.py validate
      - run: python3 ci/run-release-contracts.py
      - name: Check the normal Guest input images before starting the matrix
        id: normal-inputs
        if: inputs.normal_guest
        env:
          CARRIER_PG17: ${{ vars.DSGA_NORMAL_GUEST_CARRIER_PG17 }}
          CARRIER_PG18: ${{ vars.DSGA_NORMAL_GUEST_CARRIER_PG18 }}
          ORDINARY: ${{ vars.DSGA_NORMAL_ORDINARY_SOURCES }}
        run: |
          set -euo pipefail
          for ref in "$CARRIER_PG17" "$CARRIER_PG18" "$ORDINARY"; do
            [[ "$ref" =~ ^docker\.io/williamluckyli/[a-z0-9._-]+@sha256:[a-f0-9]{64}$ ]]
          done
          printf 'carrier_pg17=%s\ncarrier_pg18=%s\nordinary=%s\n' \
            "$CARRIER_PG17" "$CARRIER_PG18" "$ORDINARY" >> "$GITHUB_OUTPUT"
      - name: Require configured publishing credentials before expensive builds
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKER_USER" || -z "$DOCKER_TOKEN" ]]; then
            echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the Neon repository secrets' >&2
            exit 1
          fi
      - id: meta
        run: python3 ci/dsga_release.py prepare --arch "$ARCH"
  postgres-17:
    needs: prepare
    uses: william-lbn/postgres/.github/workflows/build.yml@203e1e83eff9dcb73e03cbeff685f51f7da9539c
    with:
      source_sha: ${{ needs.prepare.outputs.pg17 }}
  postgres-18:
    needs: prepare
    uses: william-lbn/postgres/.github/workflows/build.yml@47f4ff0d390996bffeaa6a14aa58ea6c29637855
    with:
      source_sha: ${{ needs.prepare.outputs.pg18 }}
  autoscaling:
    needs: [prepare, postgres-17, postgres-18]
    permissions:
      contents: read
      packages: write
    uses: william-lbn/autoscaling/.github/workflows/dockerhub.yml@ed287643b7cc4a1c18fa454aee9fae937cc1c9bf
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      arch: ${{ inputs.arch || 'amd64' }}
      source_ref: ${{ needs.prepare.outputs.autoscaling }}
      normal_kernel: ${{ inputs.normal_guest || false }}
    secrets: inherit
  control-plane:
    needs: prepare
    permissions:
      contents: read
    uses: william-lbn/control-plane/.github/workflows/dsga-control-artifacts.yml@b75609ec3b50cbe088dd1844aaaa057a18f82090
    with:
      source_sha: ${{ needs.prepare.outputs.control_plane }}
      release_tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  build-tools:
    needs: [prepare, postgres-17, postgres-18]
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable run and attempt before any registry write
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 ci/dsga_release.py verify-attempt --tag "$RELEASE_TAG" --arch "$ARCH"
      - uses: ./.github/actions/dockerhub-setup
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        id: build
        with:
          context: .
          file: ci/build-tools.Dockerfile
          platforms: linux/${{ env.ARCH }}
          push: true
          tags: ${{ env.REGISTRY }}/neon-build-tools:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=neon-build-tools-${{ env.ARCH }}
          cache-to: type=gha,scope=neon-build-tools-${{ env.ARCH }},mode=min
          provenance: mode=max
          sbom: true
      - env:
          TAG: ${{ needs.prepare.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 ci/release.py record --name neon-build-tools --image "$REGISTRY/neon-build-tools:$TAG" --digest "$DIGEST" --output output/neon-build-tools.json
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: images-neon-build-tools-attempt${{ github.run_attempt }}
          path: output/*.json
          retention-days: 90
          if-no-files-found: error
  core:
    needs: [prepare, build-tools]
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 350
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable run and attempt before any registry write
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 ci/dsga_release.py verify-attempt --tag "$RELEASE_TAG" --arch "$ARCH"
      - uses: ./.github/actions/dockerhub-setup
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ env.ARCH }}
          push: true
          tags: ${{ env.REGISTRY }}/neon:${{ needs.prepare.outputs.tag }}
          build-args: |
            REPOSITORY=${{ env.REGISTRY }}
            IMAGE=neon-build-tools
            TAG=${{ needs.prepare.outputs.tag }}@${{ needs.build-tools.outputs.digest }}
            GIT_VERSION=${{ github.sha }}
            BUILD_TAG=${{ needs.prepare.outputs.tag }}
            DEBIAN_VERSION=bookworm
            IO_ALIGNMENT=512
          labels: |
            org.opencontainers.image.source=https://github.com/william-lbn/neon
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/neon-build-cache:core-${{ env.ARCH }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/neon-build-cache:core-${{ env.ARCH }},mode=max
          provenance: mode=max
          sbom: true
      - name: Load every packaged PostgreSQL WAL redo binary from the immutable image
        env:
          IMAGE: ${{ env.REGISTRY }}/neon:${{ needs.prepare.outputs.tag }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          for major in $(jq -r '.postgres | keys[] | ltrimstr("v")' ci/distribution.json); do
            bash scripts/verify-storage-distribution.sh "$IMAGE" "$major"
          done
      - id: record
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 ci/release.py record --name neon --image "$REGISTRY/neon:$TAG" --digest "$DIGEST" --output output/neon.json
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: images-neon-core-attempt${{ github.run_attempt }}
          path: output/*.json
          retention-days: 90
          if-no-files-found: error
  core-components:
    needs: [prepare, core]
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.binaries) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable run and attempt before any registry write
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 ci/dsga_release.py verify-attempt --tag "$RELEASE_TAG" --arch "$ARCH"
      - uses: ./.github/actions/dockerhub-setup
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: name
        env:
          BINARY: ${{ matrix.binary }}
        run: echo "value=${BINARY//_/-}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        id: build
        with:
          context: .
          file: ci/component.Dockerfile
          platforms: linux/${{ env.ARCH }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.name.outputs.value }}:${{ needs.prepare.outputs.tag }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/neon:${{ needs.prepare.outputs.tag }}@${{ needs.core.outputs.digest }}
            BINARY=/usr/local/bin/${{ matrix.binary }}
          provenance: mode=max
          sbom: true
      - env:
          NAME: ${{ steps.name.outputs.value }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 ci/release.py record --name "$NAME" --image "$REGISTRY/$NAME:$TAG" --digest "$DIGEST" --output "output/$NAME.json"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: images-core-${{ steps.name.outputs.value }}-attempt${{ github.run_attempt }}
          path: output/*.json
          retention-days: 90
          if-no-files-found: error
  compute:
    needs: [prepare, postgres-17, postgres-18]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.postgres_matrix) }}
    uses: ./.github/workflows/_compute-images.yml
    with:
      source_commit: ${{ needs.prepare.outputs.source_commit }}
      profile: ${{ matrix.profile }}
      pg: ${{ matrix.pg }}
      debian: ${{ matrix.debian }}
      tag: ${{ needs.prepare.outputs.tag }}
      arch: ${{ inputs.arch || 'amd64' }}
    secrets: inherit
  compute-components:
    needs: [prepare, compute]
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.compute_components) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: images-compute-v17-attempt${{ github.run_attempt }}
          path: artifacts
      - name: Verify immutable run and attempt before any registry write
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 ci/dsga_release.py verify-attempt --tag "$RELEASE_TAG" --arch "$ARCH"
      - uses: ./.github/actions/dockerhub-setup
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: base
        run: echo "image=$(python3 ci/release.py lookup --name compute-node-v17)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        id: build
        with:
          context: .
          file: ci/compute-component.Dockerfile
          platforms: linux/${{ env.ARCH }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ needs.prepare.outputs.tag }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            BINARY=${{ matrix.binary }}
          provenance: mode=max
          sbom: true
      - env:
          NAME: ${{ matrix.name }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 ci/release.py record --name "$NAME" --image "$REGISTRY/$NAME:$TAG" --digest "$DIGEST" --output "output/$NAME.json"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: images-compute-component-${{ matrix.name }}-attempt${{ github.run_attempt }}
          path: output/*.json
          retention-days: 90
          if-no-files-found: error
  vm-compute:
    needs: [prepare, compute, autoscaling]
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.postgres_matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          pattern: images-*-attempt${{ github.run_attempt }}
          path: artifacts
      - name: Verify immutable run and attempt before any registry write
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 ci/dsga_release.py verify-attempt --tag "$RELEASE_TAG" --arch "$ARCH"
      - uses: ./.github/actions/dockerhub-setup
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: inputs.normal_guest && (matrix.pg == 'v17' || matrix.pg == 'v18')
        with:
          repository: william-lbn/autoscaling
          ref: ${{ needs.prepare.outputs.autoscaling }}
          path: normal-autoscaling-source
          persist-credentials: false
      - name: Build and independently reread the normal PostgreSQL Guest
        if: inputs.normal_guest && (matrix.pg == 'v17' || matrix.pg == 'v18')
        env:
          PG: ${{ matrix.pg }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CARRIER: ${{ matrix.pg == 'v17' && needs.prepare.outputs.normal_carrier_pg17 || needs.prepare.outputs.normal_carrier_pg18 }}
          ORDINARY: ${{ needs.prepare.outputs.normal_ordinary }}
        run: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y qemu-utils skopeo
          docker pull --platform linux/amd64 "$ORDINARY"
          container=$(docker create --platform linux/amd64 "$ORDINARY" true)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -m700 normal-ordinary-sources
          docker cp "$container:/ordinary-sources/." normal-ordinary-sources/
          builder=$(docker buildx inspect | sed -n 's/^Name:[[:space:]]*//p')
          [[ -n "$builder" ]]
          bash ci/build-normal-guest-release.sh "${PG#v}" "$TAG" artifacts normal-autoscaling-source \
            normal-ordinary-sources "$builder" "output/normal-$PG" "$CARRIER"
      - name: Build the legacy VM disk
        if: ${{ !inputs.normal_guest || (matrix.pg != 'v17' && matrix.pg != 'v18') }}
        env:
          PG: ${{ matrix.pg }}
          DEBIAN: ${{ matrix.debian }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          builder=$(python3 ci/release.py lookup --name vm-builder)
          daemon=$(python3 ci/release.py lookup --name neonvm-daemon)
          source=$(python3 ci/release.py lookup --name "compute-node-$PG")
          docker pull "$builder"
          id=$(docker create "$builder")
          docker cp "$id:/usr/local/bin/vm-builder" ./vm-builder
          docker rm "$id"
          chmod +x vm-builder
          docker pull "$source"
          docker pull "$daemon"
          image="$REGISTRY/vm-compute-node-$PG:$TAG"
          ./vm-builder -system-mode=legacy -size=4G -spec="compute/vm-image-spec-$DEBIAN.yaml" \
            -src="$source" -dst="$image" -daemon-image="$daemon" -target-arch="linux/$ARCH"
          docker push "$image"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$image@$digest"
          id=$(docker create "$image@$digest" true)
          docker cp "$id:/disk.qcow2" ./disk.qcow2
          docker rm "$id"
          sudo apt-get update && sudo apt-get install -y qemu-utils
          python3 ci/release.py record --name "vm-compute-node-$PG" --image "$image" --digest "$digest" \
            --vm-disk disk.qcow2 --vm-input-images artifacts --output "output/vm-compute-node-$PG.json"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: images-vm-compute-${{ matrix.pg }}-attempt${{ github.run_attempt }}
          path: |
            output/*.json
            output/normal-*/*.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: failure() && inputs.normal_guest && (matrix.pg == 'v17' || matrix.pg == 'v18')
        with:
          name: normal-guest-failure-${{ matrix.pg }}-attempt${{ github.run_attempt }}
          path: output/normal-*.pending/
          retention-days: 30
          compression-level: 0
          if-no-files-found: ignore
  validate:
    needs: [prepare, postgres-17, postgres-18, autoscaling, control-plane, core-components, compute-components, vm-compute]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/_validate-dsga.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      arch: amd64
      source_commit: ${{ needs.prepare.outputs.source_commit }}
      postgres_matrix: ${{ needs.prepare.outputs.postgres_matrix }}
      distribution_artifact: ${{ needs.prepare.outputs.distribution_artifact }}
    secrets: inherit
  helm:
    needs: [prepare, validate]
    permissions:
      contents: read
      actions: read
    uses: william-lbn/neon-helm/.github/workflows/dsga-package.yml@cbeedb79c4c3849c636b703fbc7edc346d2b043e
    with:
      helm_sha: ${{ needs.prepare.outputs.helm }}
      release_version: ${{ needs.prepare.outputs.tag }}
      distribution_artifact: ${{ needs.prepare.outputs.distribution_artifact }}
  publish:
    needs: [prepare, validate, helm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: dsga-helm-${{ needs.prepare.outputs.tag }}
          path: release
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: autoscaling-capabilities-attempt${{ github.run_attempt }}
          path: release
      - name: Verify the whole bundle before creating a tag or draft
        run: |
          set -euo pipefail
          (cd release && sha256sum --check HELM-SHA256SUMS)
          python3 ci/dsga_release.py assets --directory release --tag "$TAG" --source-commit "$SOURCE_COMMIT"
          (cd release && sha256sum --check SHA256SUMS)
      - name: Publish one complete immutable candidate (never latest)
        run: |
          set -euo pipefail
          python3 ci/dsga_release.py verify-attempt --tag "$TAG" --arch amd64
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null); then
            [[ "$existing" == "$SOURCE_COMMIT" ]]
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_COMMIT" > /dev/null
          fi
          if existing_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$existing_draft" == true ]] || { echo 'Published releases are immutable' >&2; exit 1; }
          else
            gh release create "$TAG" --verify-tag --draft --prerelease --latest=false \
              --title "Neon DSGA candidate $TAG" --notes-file release/RELEASE_NOTES.md
          fi
          mapfile -d '' assets < <(find release -maxdepth 1 -type f -print0)
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --draft=false --prerelease --latest=false --notes-file release/RELEASE_NOTES.md
          cat release/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dsga-release-${{ needs.prepare.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 90
