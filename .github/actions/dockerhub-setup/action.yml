name: Prepare distribution builder
description: Authenticate to Docker Hub and configure a bounded BuildKit worker
inputs:
  username:
    required: true
    description: Docker Hub account
  token:
    required: true
    description: Docker Hub credential from Actions Secrets
runs:
  using: composite
  steps:
    - name: Reclaim unused SDK space on the ephemeral runner
      shell: bash
      run: |
        set -euo pipefail
        for sdk in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost; do
          if [ -d "$sdk" ]; then sudo rm -rf -- "$sdk"; fi
        done
        df -h /
    - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}
    - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      with:
        buildkitd-config-inline: |
          [worker.oci]
            max-parallelism = 1
            gc = true
          [[worker.oci.gcpolicy]]
            keepBytes = 12000000000
            keepDuration = 86400
            filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
